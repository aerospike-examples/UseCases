services:
  usecases-core:
    image: aerospike/aerospike-server-enterprise:latest
    container_name: core-usecases
    command: --config-file /etc/aerospike/aerospike.conf
    ports:
      - 3000:3000
    volumes:
      - ${PWD}/config/aerospike:/etc/aerospike
      - ${PWD}/data/aerospike:/opt/aerospike/data
    healthcheck:
      test: [ "CMD", "asinfo", "-p", "3000", "-v", "build" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - usecases

networks:
  usecases:
    driver: bridge
